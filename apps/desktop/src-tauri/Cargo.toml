[package]
name = "apcode"
version = "0.0.1"
edition = "2021"
default-run = "APCode"

[[bin]]
name = "APCode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
