appId: com.apkiosk.masscode
directories:
  output: release
files:
  - dist/**
npmRebuild: false
electronLanguages:
  - en
extraResources:
  - from: ../web/dist
    to: renderer
  - from: ../daemon/dist/masscode-daemon
    to: masscode-daemon
publish:
  provider: github
  owner: masmeert
  repo: code
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icon
  category: public.app-category.developer-tools
  identity: "Massimo Meert (3942GST99F)"
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
dmg:
  icon: resources/icon.icns
